name: CI + Deploy

on:
  push:
    branches: [main]
    # Skip the workflow entirely when a push only touches documentation /
    # local-factory artefacts / completion reports. These never affect the
    # built worker, so a deploy adds CF API pressure for zero user-visible
    # change. PRs still run the full workflow regardless of paths so
    # reviewers always see CI status.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".nightshift/**"
      - ".ralph/**"
      - ".completion-reports/**"
      - ".ronan-skills.json"
      - "ATTRIBUTION.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (PR + main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # Build first: routeTree.gen.ts is gitignored and generated as a side
      # effect of the tanstackStart vite plugin. Typecheck needs it to resolve
      # route-id types. Local dev gets it via `vite dev`; CI needs `vite build`.
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # Apply only NEW migrations. wrangler d1 migrations apply reads
      # drizzle/meta/_journal.json (the Drizzle migration journal) and the
      # remote `__drizzle_migrations` tracking table, then applies only the
      # files that haven't run yet. The migrations_dir is configured in
      # wrangler.jsonc as "drizzle".
      #
      # Replaces the previous brute-force loop that re-applied every .sql
      # on every deploy. That pattern was: ~13 API calls per deploy ×
      # ~20 deploys/day = ~260 calls/day, tripped CF Workers API rate-limit
      # 10429 on 2026-05-19. This step is now 1 API call per deploy.
      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply lekkertaal_db --remote
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lekkertaal.ronanconnolly.dev/)
          echo "Smoke test status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
